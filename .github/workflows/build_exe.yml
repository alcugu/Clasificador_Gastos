name: Generar EXE Windows

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias y PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pywin32 pyinstaller

      - name: Compilar Clasificador_Otros_Gastos.exe
        run: |
          pyinstaller --onefile --windowed --hidden-import=openpyxl --hidden-import=win32timezone --name Clasificador_Otros_Gastos Clasificador_Otros_Gastos.py

      - name: Subir el archivo .exe generado
        uses: actions/upload-artifact@v4
        with:
          name: Clasificador_Otros_Gastos_Windows
          path: dist/Clasificador_Otros_Gastos.exe
